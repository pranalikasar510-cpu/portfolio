<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 360">
  <rect width="300" height="360" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" rx="4"/>
  <!-- Inner Photo Area -->
  <rect x="16" y="16" width="268" height="268" fill="#1E293B" rx="2"/>
  <!-- Blueprint drawing -->
  <g stroke="#38BDF8" stroke-width="1.2" fill="none" opacity="0.85">
    <rect x="40" y="40" width="140" height="180" stroke-dasharray="4,3"/>
