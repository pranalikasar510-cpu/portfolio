<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="spatialBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="600" height="500" rx="16" fill="url(#spatialBg)"/>

  <!-- Architectural drafting blueprint lines -->
  <g stroke="#334155" stroke-width="1" opacity="0.5">
    <line x1="0" y1="50" x2="600" y2="50" stroke-dasharray="2,4"/>
    <line x1="0" y1="150" x2="600" y2="150" stroke-dasharray="2,4"/>
    <line x1="0" y1="250" x2="600" y2="250" stroke-dasharray="2,4"/>
    <line x1="0" y1="350" x2="600" y2="350" stroke-dasharray="2,4"/>
    <line x1="0" y1="450" x2="600" y2="450" stroke-dasharray="2,4"/>
    
    <line x1="100" y1="0" x2="100" y2="500" stroke-dasharray="2,4"/>
    <line x1="200" y1="0" x2="200" y2="500" stroke-dasharray="2,4"/>
    <line x1="300" y1="0" x2="300" y2="500" stroke-dasharray="2,4"/>
    <line x1="400" y1="0" x2="400" y2="500" stroke-dasharray="2,4"/>
    <line x1="500" y1="0" x2="500" y2="500" stroke-dasharray="2,4"/>
  </g>

  <!-- Interactive Floor Plan Visualization -->
  <g transform="translate(80, 70)">
    <!-- Outer perimeter wall -->
    <rect x="0" y="0" width="440" height="360" rx="12" fill="none" stroke="#38BDF8" stroke-width="2.5" opacity="0.8"/>
    
    <!-- Zone A: Collaboration Studio -->
    <rect x="20" y="20" width="180" height="140" rx="8" fill="#0284C7" fill-opacity="0.15" stroke="#0284C7" stroke-width="1.5"/>
    <text x="35" y="45" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#38BDF8">ZONE 01 • STUDIO</text>
    <text x="35" y="65" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">Occupancy: 85% (Optimal)</text>
    <!-- Heatmap dots -->
    <circle cx="60" cy="105" r="12" fill="#38BDF8" fill-opacity="0.6" filter="url(#glow)"/>
    <circle cx="110" cy="115" r="16" fill="#38BDF8" fill-opacity="0.7" filter="url(#glow)"/>
    <circle cx="155" cy="95" r="10" fill="#38BDF8" fill-opacity="0.5"/>

    <!-- Zone B: Focus Pods -->
    <rect x="220" y="20" width="200" height="140" rx="8" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="1.5"/>
    <text x="235" y="45" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#34D399">ZONE 02 • FOCUS PODS</text>
    <text x="235" y="65" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">Noise Level: 38 dB (Calm)</text>
    <rect x="235" y="85" width="40" height="45" rx="4" fill="#10B981" fill-opacity="0.3" stroke="#34D399"/>
    <rect x="290" y="85" width="40" height="45" rx="4" fill="#10B981" fill-opacity="0.3" stroke="#34D399"/>
    <rect x="345" y="85" width="40" height="45" rx="4" fill="#10B981" fill-opacity="0.3" stroke="#34D399"/>

    <!-- Zone C: Town Hall & Courtyard -->
    <rect x="20" y="180" width="400" height="160" rx="8" fill="#6366F1" fill-opacity="0.12" stroke="#6366F1" stroke-width="1.5"/>
    <text x="35" y="208" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#818CF8">ZONE 03 • CENTRAL ATRIUM</text>
    <text x="35" y="226" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">Air Quality: AQI 24 • Energy Saver Mode Active</text>
    
    <!-- Architectural dimension ticks -->
    <path d="M20 350 L420 350" stroke="#F8FAFC" stroke-width="1.5"/>
    <line x1="20" y1="344" x2="20" y2="356" stroke="#F8FAFC" stroke-width="2"/>
    <line x1="420" y1="344" x2="420" y2="356" stroke="#F8FAFC" stroke-width="2"/>
    <text x="205" y="346" font-family="system-ui, monospace" font-size="10" fill="#F8FAFC" font-weight="700">32.4 METERS</text>
  </g>
</svg>