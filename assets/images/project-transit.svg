<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="transitBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
  </defs>
  <rect width="600" height="500" rx="16" fill="url(#transitBg)"/>

  <!-- Minimalist transit lines schematic -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Blue Metro Line -->
    <path d="M60 120 L240 120 L380 260 L540 260" fill="none" stroke="#2563EB" stroke-width="12"/>
    
    <!-- Red Express Line -->
    <path d="M120 440 L260 300 L260 100 L440 100" fill="none" stroke="#DC2626" stroke-width="12"/>
    
    <!-- Green Loop Line -->
    <path d="M80 320 L220 320 L380 160 L500 160" fill="none" stroke="#16A34A" stroke-width="10" stroke-dasharray="14,8"/>
  </g>

  <!-- Transfer Hub Interchange Station -->
  <circle cx="240" cy="120" r="16" fill="#FFFFFF" stroke="#0F172A" stroke-width="5"/>
  <circle cx="260" cy="300" r="16" fill="#FFFFFF" stroke="#0F172A" stroke-width="5"/>
  <circle cx="380" cy="260" r="16" fill="#FFFFFF" stroke="#0F172A" stroke-width="5"/>

  <!-- Wayfinding Signage Card overlay -->
  <g transform="translate(280, 290)">
    <rect width="270" height="160" rx="16" fill="#0F172A"/>
    <rect x="16" y="16" width="36" height="36" rx="8" fill="#2563EB"/>
    <text x="28" y="40" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">M1</text>
    
    <text x="64" y="32" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">Central Terminal</text>
    <text x="64" y="48" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">Transfer to Red Line (Walk 2 min)</text>
    
    <line x1="16" y1="66" x2="254" y2="66" stroke="#334155" stroke-width="1"/>
    
    <text x="16" y="92" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">Platform 2 • Southbound</text>
    <text x="16" y="115" font-family="system-ui, sans-serif" font-size="24" font-weight="800" fill="#38BDF8">2 min</text>
    <text x="80" y="115" font-family="system-ui, sans-serif" font-size="13" fill="#64748B">Next: 8 min</text>
    
    <rect x="16" y="130" width="238" height="6" rx="3" fill="#1E293B"/>
    <rect x="16" y="130" width="180" height="6" rx="3" fill="#22C55E"/>
  </g>
</svg>