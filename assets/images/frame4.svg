<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 360">
  <rect width="300" height="360" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" rx="4"/>
  <rect x="16" y="16" width="268" height="268" fill="#F8FAFC" rx="2"/>
  <!-- Glass wall with sticky notes -->
  <g>
    <!-- Yellow stickies -->
    <rect x="40" y="50" width="65" height="65" rx="4" fill="#FEF08A" filter="drop-shadow(0px 2px 4px rgba(0,0,0,0.1))"/>
    <line x1="48" y1="65" x2="95" y2="65" stroke="#854D0E" stroke-width="2"/>
    <line x1="48" y1="78" x2="90" y2="78" stroke="#854D0E" stroke-width="1.5"/>
    
    <!-- Pink stickies -->
    <rect x="120" y="70" width="65" height="65" rx="4" fill="#FBCFE8" filter="drop-shadow(0px 2px 4px rgba(0,0,0,0.1))" transform="rotate(3 152 102)"/>
    <line x1="128" y1="85" x2="175" y2="85" stroke="#9D174D" stroke-width="2"/>
    
    <!-- Blue stickies -->
    <rect x="195" y="55" width="65" height="65" rx="4" fill="#BAE6FD" filter="drop-shadow(0px 2px 4px rgba(0,0,0,0.1))" transform="rotate(-4 227 87)"/>
    <line x1="203" y1="70" x2="250" y2="70" stroke="#0369A1" stroke-width="2"/>

    <!-- Green stickies -->
    <rect x="70" y="145" width="70" height="70" rx="4" fill="#BBF7D0" filter="drop-shadow(0px 2px 4px rgba(0,0,0,0.1))" transform="rotate(2 105 180)"/>
    <line x1="80" y1="162" x2="130" y2="162" stroke="#166534" stroke-width="2"/>
    <line x1="80" y1="176" x2="125" y2="176" stroke="#166534" stroke-width="1.5"/>
    
    <!-- Orange stickies -->
    <rect x="165" y="155" width="68" height="68" rx="4" fill="#FED7AA" filter="drop-shadow(0px 2px 4px rgba(0,0,0,0.1))" transform="rotate(-2 199 189)"/>
    <line x1="175" y1="172" x2="222" y2="172" stroke="#9A3412" stroke-width="2"/>
  </g>
  <text x="150" y="312" font-family="Georgia, serif" font-style="italic" font-size="14" text-anchor="middle" fill="#334155">Synthesis & affinity mapping</text>
  <text x="150" y="332" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#94A3B8">Connecting user insights to prototypes</text>
</svg>